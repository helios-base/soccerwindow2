name: build

on:
  push:
    branches: [ master, develop ]
  pull_request:
  # Manual run from the Actions page. GitHub shows the button only when this
  # file exists in the default branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} / Qt${{ matrix.qt }} / ${{ matrix.build }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The same Ubuntu versions as the CI of librcsc. The minimum versions
        # of Qt (5.15 and 6.2) are not tested.
        os: [ ubuntu-24.04, ubuntu-26.04 ]
        qt: [ 5, 6 ]
        build: [ cmake, autotools ]
    env:
      # /usr/bin/qmake is qtchooser. Select Qt5 explicitly for the Qt5 jobs.
      QT_SELECT: qt5

    steps:
      - name: Check out soccerwindow2
        uses: actions/checkout@v7

      # libboost-dev and pkg-config are for building librcsc
      # (its bootstrap uses PKG_CHECK_MODULES).
      - name: Install the packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake autoconf automake libtool pkg-config \
            libboost-dev zlib1g-dev \
            desktop-file-utils
          if [ "${{ matrix.qt }}" = 5 ]; then
            sudo apt-get install -y --no-install-recommends \
              qtbase5-dev qtbase5-dev-tools qt5-qmake
          else
            sudo apt-get install -y --no-install-recommends \
              qt6-base-dev qt6-base-dev-tools qmake6 \
              libgl-dev libglx-dev libopengl-dev
          fi
          # Qt WebSockets for the WebSocket connection to rcssserver. It is
          # not installed for the Autotools jobs on Ubuntu 24.04, so that
          # soccerwindow2 without the WebSocket connection is built too.
          if [ "${{ matrix.build }}" = cmake ] || [ "${{ matrix.os }}" != ubuntu-24.04 ]; then
            if [ "${{ matrix.qt }}" = 5 ]; then
              websocket_package=libqt5websockets5-dev
            else
              websocket_package=qt6-websockets-dev
            fi
            sudo apt-get install -y --no-install-recommends "$websocket_package"
            echo "SW2_EXPECT_WEBSOCKET=yes" >> "$GITHUB_ENV"
          else
            echo "SW2_EXPECT_WEBSOCKET=no" >> "$GITHUB_ENV"
          fi

      - name: Show the versions
        run: |
          g++ --version | head -n 1
          cmake --version | head -n 1
          autoconf --version | head -n 1
          automake --version | head -n 1
          grep -m 1 'define BOOST_LIB_VERSION' /usr/include/boost/version.hpp
          if [ "${{ matrix.qt }}" = 5 ]; then
            dpkg-query -W qtbase5-dev
          else
            dpkg-query -W qt6-base-dev
          fi
          dpkg-query -W libqt5websockets5-dev qt6-websockets-dev 2>/dev/null || true
          # qmake used by the Autotools build (/usr/bin/qmake may be qtchooser)
          ls -l /usr/bin/qmake* || true

      # librcsc is built from the develop branch (the latest version; the
      # master branch is updated only about once a year), and cached by its
      # revision and the build system.
      - name: Get the revision of librcsc
        id: librcsc
        run: echo "sha=$(git ls-remote https://github.com/helios-base/librcsc.git refs/heads/develop | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache librcsc
        id: cache-librcsc
        uses: actions/cache@v6
        with:
          path: ~/local
          key: librcsc-${{ matrix.os }}-${{ matrix.build }}-${{ steps.librcsc.outputs.sha }}

      # librcsc is built by the same build system as soccerwindow2, and
      # installed into ~/local, where soccerwindow2 looks for it by default.
      # The CMake build of librcsc installs librcscConfig.cmake, and the
      # Autotools build does not.
      - name: Build librcsc (CMake)
        if: matrix.build == 'cmake' && steps.cache-librcsc.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch develop https://github.com/helios-base/librcsc.git "$RUNNER_TEMP/librcsc"
          cd "$RUNNER_TEMP/librcsc"
          CMAKE_ARGS="-DCMAKE_INSTALL_PREFIX=$HOME/local -DBUILD_TESTING=OFF" ./cmake-helper.sh install

      - name: Build librcsc (Autotools)
        if: matrix.build == 'autotools' && steps.cache-librcsc.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch develop https://github.com/helios-base/librcsc.git "$RUNNER_TEMP/librcsc"
          cd "$RUNNER_TEMP/librcsc"
          ./bootstrap
          ./configure --prefix="$HOME/local"
          make -j"$(nproc)"
          make install

      # CMake: use cmake-helper.sh (librcsc in ~/local is found by default)
      - name: Build (CMake)
        if: matrix.build == 'cmake'
        run: ./cmake-helper.sh build qt${{ matrix.qt }}

      # The configuration is run again to show how librcsc is found.
      - name: Check that librcsc is found by librcscConfig.cmake (CMake)
        if: matrix.build == 'cmake'
        run: |
          set -o pipefail
          cmake -S . -B build-qt${{ matrix.qt }} | tee "$RUNNER_TEMP/configure.log"
          grep -q 'Found librcsc .* by librcscConfig.cmake' "$RUNNER_TEMP/configure.log"

      - name: Check the WebSocket connection (CMake)
        if: matrix.build == 'cmake'
        run: ./test/check_websocket.sh build-qt${{ matrix.qt }}/config.h "$SW2_EXPECT_WEBSOCKET"

      - name: Test (CMake)
        if: matrix.build == 'cmake'
        run: ./cmake-helper.sh test qt${{ matrix.qt }}

      - name: Check the source tarball (CMake)
        if: matrix.build == 'cmake'
        run: ./cmake-helper.sh distcheck qt${{ matrix.qt }}

      # cmake/FindLibrcsc.cmake is used for librcsc without librcscConfig.cmake
      # (installed by Autotools). Disable librcscConfig.cmake, and build
      # (only the executables are linked again) and test.
      - name: Test with FindLibrcsc.cmake instead of librcscConfig.cmake (CMake)
        if: matrix.build == 'cmake'
        run: |
          set -o pipefail
          CMAKE_ARGS=-DCMAKE_DISABLE_FIND_PACKAGE_librcsc=ON ./cmake-helper.sh configure qt${{ matrix.qt }} | tee "$RUNNER_TEMP/configure-fallback.log"
          grep -q 'Found librcsc by cmake/FindLibrcsc.cmake' "$RUNNER_TEMP/configure-fallback.log"
          ./cmake-helper.sh test qt${{ matrix.qt }}

      # Autotools (librcsc in ~/local is found by configure)
      - name: Build (Autotools)
        if: matrix.build == 'autotools'
        run: |
          ./bootstrap
          ./configure --with-qt=${{ matrix.qt }}
          make -j"$(nproc)"

      - name: Check the WebSocket connection (Autotools)
        if: matrix.build == 'autotools'
        run: ./test/check_websocket.sh config.h "$SW2_EXPECT_WEBSOCKET"

      - name: Test (Autotools)
        if: matrix.build == 'autotools'
        run: make check

      - name: Check the source tarball (Autotools)
        if: matrix.build == 'autotools'
        run: make distcheck -j"$(nproc)" DISTCHECK_CONFIGURE_FLAGS="--with-qt=${{ matrix.qt }}"

      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.os }}-qt${{ matrix.qt }}-${{ matrix.build }}
          path: |
            build-qt*/CMakeFiles/CMakeOutput.log
            build-qt*/CMakeFiles/CMakeError.log
            build-qt*/CMakeFiles/CMakeConfigureLog.yaml
            build-qt*/Testing/Temporary/
            config.log
            test/*.log
            test-suite.log
          if-no-files-found: ignore
